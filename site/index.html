<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFC 碰一碰 · 播放</title>
<style>
  :root{
    --bg:#0f1115; --fg:#e8eaf0; --dim:#9aa3b2; --accent:#4f8cff; --card:#181b22;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --fg:#1b1e25; --dim:#5d6573; --accent:#2f6bdc; --card:#fff; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:420px; text-align:center;}
  .disc{
    width:150px;height:150px;margin:0 auto 26px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #2a2f3a 0 22%, #171a21 23% 100%);
    border:1px solid #2b313d; position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .disc::after{
    content:"";position:absolute;inset:14px;border-radius:50%;
    border:1px dashed #343b49;
  }
  .disc.spin::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0 70%, rgba(79,140,255,.28) 100%);
    animation:spin 6s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .disc.spin::after{animation:spin 6s linear infinite reverse}
  h1{font-size:19px;margin:0 0 6px;font-weight:600;}
  .meta{color:var(--dim);font-size:13px;margin-bottom:22px; min-height:18px;}
  .bar{
    height:5px;border-radius:3px;background:#2a2f3a;overflow:hidden;margin-bottom:8px;
  }
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear;}
  .time{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-bottom:24px;}
  button{
    font:inherit; font-size:16px; font-weight:600;
    padding:15px 34px; border-radius:999px; border:0; cursor:pointer;
    background:var(--accent); color:#fff; width:100%;
    box-shadow:0 6px 20px rgba(79,140,255,.28);
  }
  button:active{transform:translateY(1px)}
  button.ghost{
    background:transparent;color:var(--dim);border:1px solid #2b313d;box-shadow:none;
    font-size:13px;padding:10px 20px;margin-top:12px;width:auto;font-weight:400;
  }
  .err{color:#ff6b6b;font-size:13px;margin-top:16px;display:none;line-height:1.6;}
  .err.show{display:block}
  .hint{color:var(--dim);font-size:12px;margin-top:22px;line-height:1.7;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="disc" id="disc"></div>
  <h1 id="title">正在准备播放…</h1>
  <div class="meta" id="meta">&nbsp;</div>
  <div class="bar"><i id="fill"></i></div>
  <div class="time"><span id="cur">0:00</span><span id="dur">--:--</span></div>

  <button id="play" class="hidden">▶ 播放</button>
  <button id="replay" class="ghost hidden">↻ 重播</button>

  <div class="err" id="err"></div>
  <div class="hint" id="hint"></div>
</div>

<audio id="au" playsinline preload="auto"></audio>

<script>
(function () {
  "use strict";

  var au     = document.getElementById("au");
  var btn    = document.getElementById("play");
  var replay = document.getElementById("replay");
  var disc   = document.getElementById("disc");
  var fill   = document.getElementById("fill");
  var cur    = document.getElementById("cur");
  var dur    = document.getElementById("dur");
  var meta   = document.getElementById("meta");
  var title  = document.getElementById("title");
  var errBox = document.getElementById("err");
  var hint   = document.getElementById("hint");

  // ---- 取参数 ----------------------------------------------------------
  var qs = new URLSearchParams(location.search);
  // src 可以放在 ?src= ，也允许标签直接指向音频直链（此时用落地页包一层）
  var raw = qs.get("src") || qs.get("u") || "";
  var titleText = qs.get("t") || "";
  var autoFlag = qs.get("auto");
  var shortId = null;

  // 若本页被直接当音频打开（例如标签里写的是 .mp3 直链），
  // 就把当前地址当音频源，重新带 src 参数 reload 一次。
  if (!raw && /\.(mp3|m4a|aac|ogg|opus|wav|flac)(\?|$)/i.test(location.pathname + location.search)) {
    var next = location.origin + location.pathname + "?src=" + encodeURIComponent(location.href);
    location.replace(next);
    return;
  }

  // 短 ID: ?id=<id>  —— 从 config.json 查真实直链
  // 用查询参数而不是 /p/<id> 路径: GitHub Pages 不会把 /p/demo 映射到
  // index.html, 而 ?id= 一定命中 index.html, 零配置。
  var shortId = qs.get("id") || null;

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.classList.add("show");
  }
  function fmt(s) {
    if (!isFinite(s) || s < 0) return "--:--";
    var mm = Math.floor(s / 60), x = Math.floor(s % 60);
    return mm + ":" + (x < 10 ? "0" : "") + x;
  }

  function fail(msg) {
    title.textContent = "无法播放";
    meta.innerHTML = "&nbsp;";
    btn.classList.add("hidden");
    showErr(msg);
    hint.innerHTML = "如果是刚配好还没上传 config.json, 请等 GitHub Pages 部署完成后再试。";
  }

  // >>> FALLBACK_SONGS (auto-generated by inject_fallback.py)
  var FALLBACK_SONGS = [
    {
      id: "love",
      title: "爱情悬崖",
      url: "https://raw.githubusercontent.com/burningleaves/nfc-player/main/audio/love-cliff.aac|https://raw.githubusercontent.com/burningleaves/nfc-player/main/audio/love-cliff.m4a|https://cdn.jsdelivr.net/gh/burningleaves/nfc-player@main/audio/love-cliff.aac|https://gcore.jsdelivr.net/gh/burningleaves/nfc-player@main/audio/love-cliff.aac"
    },
  ];
  // <<< FALLBACK_SONGS

  // ---- 解析音频源 ------------------------------------------------------
  // 优先级: ?src=  >  /p/<id> 查 config.json
  function resolve(cb) {
    if (raw) { cb(raw, titleText); return; }
    if (!shortId) {
      fail("没有指定音频。用 ?src=直链 打开本页, 或访问 ?id=&lt;短ID&gt;。");
      return;
    }
    title.textContent = "正在读取配置…";
    // 多路径回退: 不同托管平台的输出目录配置不一样, 逐个试
    var cfgPaths = ["config.json", "site/config.json", "./config.json"];
    var cfgIdx = 0;
    var lastErr = null;

    function tryCfg() {
      if (cfgIdx >= cfgPaths.length) {
        // 兜底: 用页面内嵌的歌单 (写在 HTML 里的 FALLBACK_SONGS)
        if (typeof FALLBACK_SONGS !== "undefined" && FALLBACK_SONGS.length) {
          var fb = null;
          for (var k = 0; k < FALLBACK_SONGS.length; k++) {
            if (FALLBACK_SONGS[k].id === shortId) { fb = FALLBACK_SONGS[k]; break; }
          }
          if (fb) {
            title.textContent = "使用内置歌单";
            hint.innerHTML = "config.json 没读到, 已使用页面内置歌单。";
            cb(fb.url, fb.title || "");
            return;
          }
        }
        var msg = "读取 config.json 失败" + (lastErr ? ": " + lastErr : "");
        msg += "\n\n已尝试: " + cfgPaths.join(", ");
        msg += "\n\n如果托管平台输出目录是 site/, 那 config.json 应该在根目录; " +
               "反之亦然。也可能是该文件未被部署。";
        fail(msg);
        return;
      }
      var p = cfgPaths[cfgIdx++];
      fetch(p, { cache: "no-cache" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (cfg) { onConfig(cfg); })
        .catch(function (e) { lastErr = e.message; tryCfg(); });
    }

    function onConfig(cfg) {
      var list = cfg.songs || [];
      var hit = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === shortId) { hit = list[i]; break; }
      }
      if (!hit) {
        fail("config.json 里没有 id=\"" + shortId + "\" 的条目。\n现有 id: " +
             list.map(function (s) { return s.id; }).join(", "));
        return;
      }
      cb(hit.url, hit.title || "");
    }

    tryCfg();
  }

  // ---- 设置音频源 ------------------------------------------------------
  // 支持多 CDN 回退: 第一个源加载失败就自动换下一个。
  // 实测 raw.githubusercontent.com 与 jsDelivr 在不同网络下快慢不同。
  var candidates = [];
  var candIdx = 0;
  var trackName = "";

  function loadSource(srcUrl, name) {
    // srcUrl 可以是单个 URL, 也可以是用 | 分隔的多个候选源
    candidates = String(srcUrl).split("|").map(function (u) { return u.trim(); }).filter(Boolean);
    if (!candidates.length) { fail("没有可用的音频地址"); return; }
    candIdx = 0;
    trackName = name || "";
    au.preload = "auto";
    if (trackName) title.textContent = trackName;
    tryNext();
  }

  function candLabel() {
    var base = trackName || raw.replace(/\?.*$/, "").split("/").pop();
    return base + (candidates.length > 1 ? "  " + candIdx + "/" + candidates.length : "");
  }

  function tryNext() {
    if (candIdx >= candidates.length) {
      disc.classList.remove("spin");
      showErr("所有音频源都加载失败：\n" + candidates.join("\n"));
      return;
    }
    raw = candidates[candIdx++];
    au.src = raw;
    meta.textContent = candLabel();
    au.load();
  }

  var playing = false;

  // 真正的"开始播放"信号 —— play() 被拒时不会触发
  au.addEventListener("playing", function () {
    playing = true;
    disc.classList.add("spin");
    title.textContent = "正在播放";
  });

  au.addEventListener("pause", function () {
    if (au.ended) return;
    playing = false;
    disc.classList.remove("spin");
    if (!au.paused) return;
  });

  au.addEventListener("loadedmetadata", function () {
    dur.textContent = fmt(au.duration);
    meta.textContent = candLabel();
    if (!playing) { title.textContent = trackName || "准备就绪"; }
  });

  au.addEventListener("timeupdate", function () {
    cur.textContent = fmt(au.currentTime);
    if (au.duration && isFinite(au.duration)) {
      fill.style.width = (au.currentTime / au.duration * 100) + "%";
    }
  });

  au.addEventListener("ended", function () {
    disc.classList.remove("spin");
    playing = false;
    fill.style.width = "100%";
    title.textContent = "播放完毕";
    replay.classList.remove("hidden");
  });

  au.addEventListener("error", function () {
    // 重要: play() 被浏览器拦截(自动播放策略)时, 媒体元素也会触发 error 事件。
    // 如果不区分, 就会误判成"这个源坏了"而切到下一个源, 把所有源切一遍后
    // 显示"音频加载失败" —— 但其实只是需要用户点一下。
    // 判断依据: 错误来自网络/解码 (MEDIA_ERR_SRC_NOT_SUPPORTED / MEDIA_ERR_NETWORK)
    // 而不是 NotAllowedError。
    if (au.error && au.error.code === au.error.MEDIA_ERR_ABORTED) {
      return;   // 用户主动中止, 忽略
    }
    if (au.error && (au.error.code === au.error.MEDIA_ERR_DECODE ||
                     au.error.code === au.error.MEDIA_ERR_SRC_NOT_SUPPORTED ||
                     au.error.code === au.error.MEDIA_ERR_NETWORK)) {
      if (candIdx < candidates.length) {
        tryNext();   // 真的坏了, 换下一个源
        return;
      }
      disc.classList.remove("spin");
      showErr("音频加载失败：直链可能已失效，或该地址不允许跨域播放。\n" + raw);
      return;
    }
    // 没有 error 对象 —— 多半是 play() 被拒, 交给 start() 里的 catch 处理
    disc.classList.remove("spin");
  });

  // ---- 播放控制 --------------------------------------------------------
  var autoplayBlocked = false;

  function showPlayBtn(reason) {
    disc.classList.remove("spin");
    playing = false;
    title.textContent = "点一下开始播放";
    btn.classList.remove("hidden");
    btn.textContent = "▶ 播放";
    if (reason) {
      hint.innerHTML = reason;
    }
  }

  function start() {
    // 标题由 "playing" 事件来设, 这里不抢
    var p = au.play();
    if (p && p.catch) {
      p.catch(function (err) {
        // 自动播放被拦截 —— 退到「需要点一下」路径
        autoplayBlocked = true;
        var name = (err && err.name) ? err.name : "UnknownError";
        if (name === "NotAllowedError") {
          showPlayBtn("浏览器拦截了自动播放（Chrome 策略）。<br>点上面的按钮即可开始播放。");
        } else {
          showPlayBtn("自动播放失败（" + name + "）。<br>点上面的按钮重试。");
        }
      });
    }
    // 保险: 1.5 秒后如果还没开始播且按钮没显示, 强制显示
    setTimeout(function () {
      if (au.paused && btn.classList.contains("hidden") && !playing) {
        showPlayBtn("点击下面的按钮开始播放。");
      }
    }, 1500);
  }

  btn.addEventListener("click", function () {
    btn.classList.add("hidden");
    // 关键: play() 必须在 click 处理器里【同步】调用, 才能保留用户手势。
    // 之前把 play() 放进 canplay 回调(异步), 手势上下文丢失 -> Chrome 拒绝播放。
    // 所以这里: 先确保已 load, 然后立刻 play();
    // 如果 readyState 还没到 2, 也照样先 play(), Chrome 会自己缓冲。
    if (au.readyState === 0) {
      au.load();
    }
    var p;
    try {
      p = au.play();
    } catch (e) {
      p = Promise.reject(e);
    }
    if (p && p.catch) {
      p.catch(function (err) {
        var name = (err && err.name) ? err.name : "UnknownError";
        if (name === "NotAllowedError") {
          showPlayBtn("系统未允许播放。<br>请检查手机是否静音、或浏览器是否限制了此页面的音频。");
        } else {
          showPlayBtn("播放失败（" + name + "），请再点一次。");
        }
      });
    }
  });

  replay.addEventListener("click", function () {
    au.currentTime = 0;
    replay.classList.add("hidden");
    start();
  });

  // ---- 自动播放尝试 ----------------------------------------------------
  // Chrome 的自动播放策略：用户与页面有交互（点击/触摸）或已播放过音频，
  // 才允许无手势播放。NFC 跳转过来的页面算 "有导航"，但不算 "有用户手势"，
  // 所以在桌面 Chrome 上大概率被拦 —— 必须保留 btn 兜底路径。
  // 用 Web Audio 先静音「解锁」音频上下文是常见的绕过手法，
  // 但 Chrome 已对无手势场景收紧了它，所以这里只做尝试、不做依赖。
  var unlocked = false;
  var actx = null;

  function unlock() {
    if (unlocked) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      var osc = actx.createOscillator();
      var g = actx.createGain();
      g.gain.value = 0.0001;
      osc.connect(g); g.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + 0.01);
      if (actx.state === "suspended") actx.resume();
      unlocked = true;
    } catch (e) { /* 忽略 */ }
  }

  // 页面加载时就创建 AudioContext (Chrome 允许创建, 只是不能出声)
  // 这是给 Chrome 的信号: 这个页面会用音频。
  try {
    var AC0 = window.AudioContext || window.webkitAudioContext;
    if (AC0) actx = new AC0();
  } catch (e) { /* 忽略 */ }

  // 真实用户手势(触摸/点击)时解锁音频上下文
  ["touchstart", "mousedown", "keydown", "pointerdown"].forEach(function (ev) {
    document.addEventListener(ev, unlock, { passive: true });
  });

  function begin() {
    if (autoFlag === "0") {
      title.textContent = "准备就绪";
      btn.classList.remove("hidden");
      hint.innerHTML = "已关闭自动播放，点按钮开始。";
      return;
    }
    // 给浏览器一点时间完成音频缓冲，再尝试自动播放
    start();
    setTimeout(function () {
      if (au.paused) { au.play().catch(function () {}); }
    }, 300);
  }

  resolve(function (srcUrl, name) {
    loadSource(srcUrl, name);
    begin();
  });
})();
</script>
</body>
</html>
