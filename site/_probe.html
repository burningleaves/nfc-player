<!doctype html><html><body>
<iframe id="f" src="https://burningleaves.github.io/nfc-player/?id=love" style="width:900px;height:700px"></iframe>
<pre id="out" style="font-size:13px;color:#0f0;background:#000;padding:10px;white-space:pre-wrap"></pre>
<script>
function dump(tag) {
  var out = document.getElementById('out');
  try {
    var f = document.getElementById('f');
    var w = f.contentWindow;
    var au = w.document.getElementById('au');
    out.textContent = tag + '\n' +
      'error=' + (au.error ? (au.error.code + ' | ' + au.error.message.substring(0,180)) : 'null') + '\n' +
      'readyState=' + au.readyState + '\n' +
      'networkState=' + au.networkState + '\n' +
      'duration=' + au.duration + '\n' +
      'paused=' + au.paused + '\n' +
      'currentTime=' + au.currentTime + '\n' +
      'crossOrigin=' + au.crossOrigin + '\n' +
      'currentSrc=' + au.currentSrc.substring(0,90);
  } catch (e) {
    out.textContent = tag + ' probe error: ' + e.message;
  }
}
setTimeout(function(){ dump('T+6s (auto)'); }, 6000);
</script></body></html>
