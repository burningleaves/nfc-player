<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>爱情悬崖</title>
<style>
  :root{
    --bg:#0b0d10; --fg:#eceff4; --dim:#8b95a5; --accent:#4f8cff;
    --card:#14171d; --line:#232830;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f7; --fg:#16191f; --dim:#5f6875; --card:#fff; --line:#e2e5ea; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
    overscroll-behavior:none;
  }
  .wrap{width:100%; max-width:400px;}
  .cover{
    width:min(74vw, 300px); aspect-ratio:1; margin:0 auto 26px;
    border-radius:50%; overflow:hidden; position:relative;
    box-shadow:0 18px 46px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover.spin img{animation:spin 9s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .cover::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.16), transparent 46%);
    pointer-events:none;
  }
  .title{font-size:20px; font-weight:650; text-align:center; margin:0 0 4px;}
  .artist{font-size:13px; color:var(--dim); text-align:center; margin:0 0 20px;}
  .bar{
    height:22px; display:flex; align-items:center; cursor:pointer;
    touch-action:none; margin-bottom:4px;
  }
  .track{height:5px; width:100%; background:var(--line); border-radius:3px; position:relative;}
  .fill{
    height:100%; width:0; background:var(--accent); border-radius:3px;
    position:relative;
  }
  .fill::after{
    content:""; position:absolute; right:-6px; top:50%;
    width:12px; height:12px; margin-top:-6px; border-radius:50%;
    background:var(--accent); box-shadow:0 1px 5px rgba(0,0,0,.5);
    opacity:0; transition:opacity .15s;
  }
  .bar.active .fill::after{opacity:1;}
  .times{display:flex; justify-content:space-between; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums;}
  .ctrls{display:flex; align-items:center; justify-content:center; gap:26px; margin:22px 0 6px;}
  .btn{
    width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
    background:transparent; color:var(--fg); display:flex; align-items:center;
    justify-content:center; transition:transform .12s, background .15s;
  }
  .btn:active{transform:scale(.9);}
  .btn svg{width:26px; height:26px; fill:currentColor;}
  .btn.main{
    width:64px; height:64px; background:var(--accent); color:#fff;
    box-shadow:0 8px 24px rgba(79,140,255,.34);
  }
  .btn.main svg{width:30px; height:30px;}
  .btn:disabled{opacity:.35;}
  .hint{color:var(--dim); font-size:12px; text-align:center; margin-top:16px; line-height:1.6;}
  .err{color:#ff6b6b; font-size:13px; text-align:center; margin-top:12px; display:none; line-height:1.6;}
  .err.show{display:block;}
  .hidden{display:none !important;}
  .diag{font-size:10px; opacity:.4; text-align:center; margin-top:10px; font-family:monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cover" id="cover"><img id="img" src="cover.jpg" alt=""></div>
  <h1 class="title" id="title">爱情悬崖</h1>
  <div class="artist" id="artist">周杰伦 · 叶惠美</div>

  <div class="bar" id="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="times"><span id="cur">0:00</span><span id="dur">--:--</span></div>

  <div class="ctrls">
    <button class="btn" id="prev" aria-label="上一首">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
    </button>
    <button class="btn main" id="play" aria-label="播放">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn" id="next" aria-label="下一首">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
    </button>
  </div>

  <div class="err" id="err"></div>
  <div class="hint" id="hint"></div>
  <div class="diag" id="diag"></div>
</div>

<audio id="au" playsinline preload="auto"></audio>

<script>(function () {
"use strict";

var au = document.getElementById("au");
var cover = document.getElementById("cover");
var img = document.getElementById("img");
var titleEl = document.getElementById("title");
var artistEl = document.getElementById("artist");
var bar = document.getElementById("bar");
var fill = document.getElementById("fill");
var curEl = document.getElementById("cur");
var durEl = document.getElementById("dur");
var playBtn = document.getElementById("play");
var playIcon = document.getElementById("playIcon");
var prevBtn = document.getElementById("prev");
var nextBtn = document.getElementById("next");
var errBox = document.getElementById("err");
var hint = document.getElementById("hint");
var diagEl = document.getElementById("diag");

var qs = new URLSearchParams(location.search);
var shortId = qs.get("id") || null;
var directSrc = qs.get("src") || "";

var candidates = [], candIdx = 0, trackName = "", trackArtist = "";
var playing = false, actx = null, gainNode = null;
var scrubbing = false, scrubTime = 0;
var playlist = [];

var ICON_PLAY = "M8 5v14l11-7z";
var ICON_PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";

function fmt(s) {
  if (!isFinite(s) || s < 0) return "--:--";
  var m = Math.floor(s / 60), x = Math.floor(s % 60);
  return m + ":" + (x < 10 ? "0" : "") + x;
}

function showErr(m) { errBox.textContent = m; errBox.classList.add("show"); }
function clearErr() { errBox.classList.remove("show"); errBox.textContent = ""; }

function setIcon(on) {
  playIcon.setAttribute("d", on ? ICON_PAUSE : ICON_PLAY);
  playBtn.setAttribute("aria-label", on ? "暂停" : "播放");
}

function setPlaying(on) {
  playing = on;
  setIcon(on);
  cover.classList.toggle("spin", on);
}

function showDiag() {
  if (!diagEl) return;
  var b = [];
  b.push("st=" + au.readyState);
  b.push(au.paused ? "paused" : "playing");
  b.push("ctx=" + (actx ? actx.state : "none"));
  b.push(au._srcSetByUser ? "wa" : "direct");
  b.push("v=" + au.volume);
  diagEl.textContent = b.join(" ");
}
setInterval(showDiag, 500);

function unlock() {
  if (!actx) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) {}
  }
  if (!actx) return;
  try {
    if (actx.state === "suspended") actx.resume();
    var osc = actx.createOscillator(), g = actx.createGain();
    g.gain.value = 0.0001;
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.01);
  } catch (e) {}
}

function route() {
  if (!actx || actx.state !== "running") return false;
  if (au._srcSetByUser) return true;
  try {
    var src = au.createMediaElementSource(au);
    gainNode = actx.createGain();
    gainNode.gain.value = 1.0;
    src.connect(gainNode);
    gainNode.connect(actx.destination);
    au._srcSetByUser = true;
    return true;
  } catch (e) { return false; }
}

function routeWhenReady() {
  if (!actx) return;
  if (actx.state === "running") { route(); return; }
  try { actx.resume(); } catch (e) {}
  try {
    actx.addEventListener("statechange", function () {
      if (actx.state === "running") route();
    }, { once: true });
  } catch (e) {}
  setTimeout(function () { if (actx.state === "running") route(); }, 250);
  setTimeout(function () { if (actx.state === "running") route(); }, 800);
}

["touchstart", "mousedown", "keydown", "pointerdown"].forEach(function (ev) {
  document.addEventListener(ev, unlock, { passive: true });
});

function clearHint() {
  if (hint) { hint.innerHTML = ""; hint.removeAttribute("style"); }
}

function toggle() {
  unlock();
  if (au.paused) {
    clearErr();
    clearHint();
    var p;
    try { p = au.play(); } catch (e) { p = Promise.reject(e); }
    if (p && p.catch) {
      p.catch(function (err) {
        var n = (err && err.name) ? err.name : "Error";
        showErr("播放失败 (" + n + ")，请再点一次。");
      });
    }
    routeWhenReady();
  } else {
    au.pause();
  }
}playBtn.addEventListener("click", toggle);

function step(dir) {
  if (!playlist.length) {
    if (dir < 0) { au.currentTime = 0; au.play(); }
    return;
  }
  var i = playlist.findIndex(function (s) { return s.id === shortId; });
  if (i < 0) i = 0;
  var n = (i + dir + playlist.length) % playlist.length;
  loadTrack(playlist[n]);
}
prevBtn.addEventListener("click", function () { step(-1); });
nextBtn.addEventListener("click", function () { step(1); });

function ratioFromEvent(e) {
  var r = bar.getBoundingClientRect();
  var cx = e.clientX;
  if (cx === undefined || cx === null) {
    if (e.touches && e.touches.length) cx = e.touches[0].clientX;
    else if (e.changedTouches && e.changedTouches.length) cx = e.changedTouches[0].clientX;
  }
  if (cx === undefined || cx === null) return 0;
  var v = (cx - r.left) / r.width;
  return Math.max(0, Math.min(1, v));
}
function paint(ratio) { fill.style.width = (Math.max(0, Math.min(1, ratio)) * 100) + "%"; }

function seekTo(ratio) {
  if (!au.duration || !isFinite(au.duration)) return;
  var t = ratio * au.duration;
  try { au.currentTime = t; } catch (err) {}
  paint(ratio);
  curEl.textContent = fmt(t);
}

function startScrub(e) {
  if (!au.duration || !isFinite(au.duration)) return;
  scrubbing = true;
  bar.classList.add("active");
  var ratio = ratioFromEvent(e);
  scrubTime = ratio * au.duration;
  paint(ratio);
  curEl.textContent = fmt(scrubTime);
  if (e.cancelable) e.preventDefault();
}

function moveScrub(e) {
  if (!scrubbing) return;
  var ratio = ratioFromEvent(e);
  if (au.duration && isFinite(au.duration)) scrubTime = ratio * au.duration;
  paint(ratio);
  curEl.textContent = fmt(scrubTime);
  if (e.cancelable) e.preventDefault();
}

function endScrub(e) {
  if (!scrubbing) return;
  scrubbing = false;
  bar.classList.remove("active");
  if (au.duration && isFinite(au.duration) && isFinite(scrubTime)) {
    seekTo(scrubTime / au.duration);
  }
  if (e && e.cancelable) e.preventDefault();
}

// pointer 事件统一处理鼠标+触摸; 再补 click 兜底
bar.addEventListener("pointerdown", startScrub);
window.addEventListener("pointermove", moveScrub);
window.addEventListener("pointerup", endScrub);
window.addEventListener("pointercancel", endScrub);
bar.addEventListener("mousedown", function (e) {
  if (e.pointerType) return;   // pointer 事件已处理
  startScrub(e);
});
bar.addEventListener("touchstart", function (e) {
  if (e.pointerType) return;
  startScrub(e);
}, { passive: false });
window.addEventListener("mousemove", moveScrub);
window.addEventListener("touchmove", moveScrub, { passive: false });
window.addEventListener("mouseup", endScrub);
window.addEventListener("touchend", endScrub);

// 单击进度条直接跳转
bar.addEventListener("click", function (e) {
  if (!scrubbing && au.duration && isFinite(au.duration)) {
    seekTo(ratioFromEvent(e));
  }
});au.addEventListener("timeupdate", function () {
  if (scrubbing) return;
  curEl.textContent = fmt(au.currentTime);
  if (au.duration && isFinite(au.duration)) paint(au.currentTime / au.duration);
});
au.addEventListener("loadedmetadata", function () {
  durEl.textContent = fmt(au.duration);
});
au.addEventListener("play", function () { setPlaying(true); clearHint(); });
au.addEventListener("pause", function () { setPlaying(false); });
au.addEventListener("ended", function () {
  setPlaying(false);
  paint(0);
  curEl.textContent = "0:00";
  if (playlist.length) step(1);
});
au.addEventListener("error", function () {
  if (au.error && au.error.code === au.error.MEDIA_ERR_ABORTED) return;
  if (au.error && (au.error.code === au.error.MEDIA_ERR_DECODE ||
                     au.error.code === au.error.MEDIA_ERR_SRC_NOT_SUPPORTED ||
                     au.error.code === au.error.MEDIA_ERR_NETWORK)) {
    if (candIdx < candidates.length) { tryNext(); return; }
    showErr("音频加载失败，请检查网络后重试。");
  }
});

function tryNext() {
  if (candIdx >= candidates.length) {
    showErr("所有音频源都不可用，请检查网络。");
    return;
  }
  au.src = candidates[candIdx++];
  au.load();
}

function loadTrack(track) {
  shortId = track.id;
  trackName = track.title || "";
  trackArtist = track.artist || "";
  titleEl.textContent = trackName || "未知歌曲";
  artistEl.textContent = trackArtist || "";
  if (track.cover) img.src = track.cover;
  candidates = String(track.url || "").split("|").map(function (u) { return u.trim(); }).filter(Boolean);
  candIdx = 0;
  clearErr();
  paint(0);
  curEl.textContent = "0:00";
  durEl.textContent = "--:--";
  if (!candidates.length) { showErr("没有音频地址。"); return; }
  tryNext();
}

function applyConfig(cfg) {
  playlist = cfg.songs || [];
  if (directSrc) {
    loadTrack({ id: shortId || "d", title: cfg.title || "", url: directSrc });
    return;
  }
  var hit = null;
  for (var i = 0; i < playlist.length; i++) {
    if (playlist[i].id === shortId) { hit = playlist[i]; break; }
  }
  if (!hit) {
    if (playlist.length === 1) { hit = playlist[0]; }
    else {
      showErr("没有找到 id=\"" + shortId + "\"。可用: " +
             playlist.map(function (s) { return s.id; }).join(", "));
      return;
    }
  }
  loadTrack(hit);
}

var CFG_PATHS = ["config.json", "site/config.json", "./config.json"];
function loadConfig() {
  var i = 0;
  function next() {
    if (i >= CFG_PATHS.length) { showErr("读取 config.json 失败。"); return; }
    fetch(CFG_PATHS[i++], { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(applyConfig)
      .catch(function () { next(); });
  }
  next();
}

function autoplay() {
  var p;
  try { p = au.play(); } catch (e) { p = Promise.reject(e); }
  if (p && p.catch) {
    p.catch(function (err) {
      var n = (err && err.name) ? err.name : "Error";
      if (n === "NotAllowedError") {
        hint.innerHTML = "浏览器拦截了自动播放。<br>点上面的 ▶ 按钮即可开始播放。";
      }
    });
  }
}

fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.ok ? r.text() : null; })
  .then(function (t) {
    if (t && t.trim() && t.trim() !== "20261115-4") {
      hint.innerHTML = "检测到新版本 (" + t.trim() + ")，当前是旧缓存。<br>请下拉刷新。";
    }
  })
  .catch(function () {});

loadConfig();
setTimeout(autoplay, 400);

})();
</script>
</body>
</html>
